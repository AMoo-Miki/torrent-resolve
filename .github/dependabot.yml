version: 2

updates:
  # The workflows pin every action to a commit SHA, because a tag can be repointed at new code
  # while a SHA cannot — and these actions run with contents: write, pull-requests: write and
  # id-token: write, the last of which is the npm publishing right. The cost of pinning is that a
  # SHA never moves on its own, so something has to bump it or the actions freeze at whatever was
  # current the day they were pinned.
  #
  # Dependabot cannot be triggered by an event, only on a schedule, so it cannot run at release
  # time. The interval here is set to the longest available on purpose: the scheduled run is a
  # backstop, not the mechanism. Declaring the ecosystem is what enables the "Check for updates"
  # button under Insights -> Dependency graph -> Dependabot, and pressing that before cutting a
  # release is the intended workflow. Anything shorter than yearly would just be noise arriving
  # at moments nobody asked for it.
  #
  # Either way the update is a reviewable pull request that bumps the SHA and its trailing version
  # comment together, prefixed `ci` so a routine action bump can never trigger a release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: yearly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
